<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4 - Calificación</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Ejercicio 4: Calificación Final</h1>
    <p>55% parciales + 30% examen + 15% trabajo</p>

    <label for="p1">Parcial 1:</label>
    <input type="number" id="p1" min="0" max="100">

    <label for="p2">Parcial 2:</label>
    <input type="number" id="p2" min="0" max="100">

    <label for="p3">Parcial 3:</label>
    <input type="number" id="p3" min="0" max="100">

    <label for="examen">Examen Final:</label>
    <input type="number" id="examen" min="0" max="100">

    <label for="trabajo">Trabajo Final:</label>
    <input type="number" id="trabajo" min="0" max="100">

    <div id="error" class="error"></div>
    <button onclick="calcularCalificacion()">Calcular Calificación Final</button>
    
    <div id="result" class="result"></div>
  </div>

  <script src="script4.js"></script>
</body>
</html>
